apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.frontendName" . }}
  labels:
    {{- include "taskboard.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "taskboard.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
