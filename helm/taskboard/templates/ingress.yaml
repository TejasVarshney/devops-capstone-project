{{- if .Values.ingress.enabled }}
{{- $backend := include "taskboard.backendName" . }}
{{- $frontend := include "taskboard.frontendName" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
    {{- else }}
    - http: # no host: match any hostname, e.g. the cloud load balancer's
    {{- end }}
        paths:
          # /api -> FastAPI (no rewrite: the backend itself serves /api/...)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $backend }}
                port:
                  name: http
          # Swagger UI and its schema, for the demo
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ $backend }}
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ $backend }}
                port:
                  name: http
          # everything else -> React frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $frontend }}
                port:
                  name: http
{{- end }}
