{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "taskboard.databaseUrl" . | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ required "postgres.auth.password is required" .Values.postgres.auth.password | quote }}
  {{- end }}
{{- end }}
