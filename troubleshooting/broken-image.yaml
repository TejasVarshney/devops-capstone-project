# Lab 1 - a Deployment that never becomes Ready.
#   kubectl apply -f troubleshooting/broken-image.yaml
# Then investigate with get / describe / events. The answer is in solutions/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  labels:
    app: broken-image
    lab: troubleshooting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
        lab: troubleshooting
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30-alpne
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
