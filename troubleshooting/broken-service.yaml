# Lab 2 - the Pods are Running, but nothing answers through the Service.
#   kubectl apply -f troubleshooting/broken-service.yaml
#   kubectl run curl --rm -it --restart=Never --image=curlimages/curl -- curl -m 3 http://web-svc
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    lab: troubleshooting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
        lab: troubleshooting
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  labels:
    lab: troubleshooting
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
