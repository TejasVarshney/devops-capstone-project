# Dependency scanning: Dependabot opens pull requests when dependencies have updates
# or known vulnerabilities. Every such PR still has to pass the CI pipeline.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
